# =====================================================================
# Nombre de la aplicación
# =====================================================================
# Identifica el proyecto en los logs y en el contexto de Spring.
spring.application.name=mj-taller-git-2026

# =====================================================================
# Configuración de la base de datos H2
# =====================================================================
# Base EN MEMORIA. Se usa "mem" para evitar bloqueos de archivo en Windows
# y para que el profe no tenga que instalar nada: al arrancar se crea, al
# detener se borra.
#
# DB_CLOSE_DELAY=-1        -> mantiene la base viva mientras la JVM corra.
# DB_CLOSE_ON_EXIT=FALSE   -> evita que H2 la cierre al salir.
spring.datasource.url=jdbc:h2:mem:cs2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Driver JDBC de H2. Spring Boot lo detecta solo, pero lo dejamos explícito.
spring.datasource.driver-class-name=org.h2.Driver

# Usuario y contraseña por defecto de H2 (solo desarrollo).
spring.datasource.username=sa
spring.datasource.password=

# =====================================================================
# Configuración de JPA / Hibernate
# =====================================================================
# create-drop: crea las tablas al arrancar y las borra al detener.
# Ideal para desarrollo con base en memoria: cada arranque parte limpio.
spring.jpa.hibernate.ddl-auto=create-drop

# Muestra en consola el SQL que genera Hibernate (útil para ver las
# tablas y los INSERT/UPDATE que disparan las reglas de negocio).
spring.jpa.show-sql=true

# Formatea ese SQL en varias líneas para que sea legible.
spring.jpa.properties.hibernate.format_sql=true

# Desactiva open-in-view: cierra la sesión JPA al terminar cada request.
# Evita la advertencia de Spring Boot 4 y fuerza a que el service cargue
# lo que necesita antes de devolver la respuesta.
spring.jpa.open-in-view=false

# =====================================================================
# Consola H2 (solo desarrollo)
# =====================================================================
# Habilita http://localhost:8080/h2-console para inspeccionar las tablas
# desde el navegador (JDBC URL: jdbc:h2:mem:cs2db, usuario: sa, sin pass).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# Mensajes de error
# =====================================================================
# Incluye el mensaje de error en el JSON de error por defecto de Spring.
# (Los errores de dominio los maneja GlobalExceptionHandler con su propio
# formato: {"error": "...", "mensaje": "..."}.)
server.error.include-message=always

# ---- Clientes POO-09 ----
api.a2.nombre=A2
api.a2.base-url=http://localhost:8082
api.a2.habilitado=true
api.a2.timeout-ms=3000

api.a3.nombre=A3
api.a3.base-url=http://localhost:8083
api.a3.habilitado=true
api.a3.timeout-ms=3000

# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
