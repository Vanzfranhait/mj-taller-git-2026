# Nombre de la aplicación
spring.application.name=mj-taller-git-2026

# --- Configuración de la base de datos H2 ---
# Base de datos en archivo (persiste entre reinicios). 
# Si prefieres en memoria, usa: jdbc:h2:mem:cs2db
spring.datasource.url=jdbc:h2:file:./data/cs2db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Configuración de JPA / Hibernate ---
# update: crea/actualiza las tablas automáticamente sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra el SQL generado en la consola (útil para aprender)
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible
spring.jpa.properties.hibernate.format_sql=true

# --- Consola web de H2 (para ver las tablas) ---
# Disponible en: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console
