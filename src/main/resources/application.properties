# Nombre de la aplicación
spring.application.name=mj-taller-git-2026

# --- Configuración de la base de datos H2 ---
# Usamos una base en memoria (mem) para evitar problemas de bloqueo de archivos en Windows.
spring.datasource.url=jdbc:h2:mem:cs2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Configuración de JPA / Hibernate ---
# create-drop: crea las tablas al arrancar y las borra al salir (ideal para desarrollo con mem)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar open-in-view para evitar advertencias en Spring Boot 4
spring.jpa.open-in-view=false
